<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Champagne Method | Coaching</title>
    <meta
      name="description"
      content="Coaching in agency, communication, and empathy. Nothing changes until you see it differently — my work is asking the questions that open it."
    />
    <meta property="og:title" content="The Champagne Method | Coaching" />
    <meta
      property="og:description"
      content="Coaching in agency, communication, and empathy. Nothing changes until you see it differently."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thechampagnemethod.co/" />
    <!-- A large-image card was declared with no image to put in it, so every
         shared link rendered a blank card. That is the first thing anybody sees
         of this site when somebody passes it on.

         THE FIRST FIX USED THE HUMAN DESIGN CHART, WHICH MADE IT WORSE. Every
         shared coaching link then previewed a bodygraph above the title "The
         Champagne Method | Coaching" -- and a Human Design practitioner read
         that thread and asked, reasonably, where the coaching method was. The
         card now describes the coaching, because that is what this domain is.
         The readings have their own domain and their own card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://thechampagnemethod.co/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://thechampagnemethod.co/og-card.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Structured data: tells Google that "The Champagne Method" is a coaching
         practice run by a person, not the sparkling-wine process of the same name.
         Deliberately carries no address or phone number. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://thechampagnemethod.co/#website",
            "url": "https://thechampagnemethod.co/",
            "name": "The Champagne Method",
            "description": "Coaching in agency, communication, and empathy.",
            "publisher": { "@id": "https://thechampagnemethod.co/#person" },
            "inLanguage": "en-US"
          },
          {
            "@type": "Person",
            "@id": "https://thechampagnemethod.co/#person",
            "name": "Jeremy Champagne",
            "url": "https://thechampagnemethod.co/",
            "jobTitle": "Coach",
            "description": "Coach working in agency, communication, and empathy.",
            "knowsAbout": ["Coaching", "Communication", "Empathy", "Personal agency", "Human Design"],
            "sameAs": [
              "https://www.facebook.com/Mr.Champagne.Martin",
              "https://www.instagram.com/mr_jeremy_champagne/"
            ]
          },
          {
            "@type": "Service",
            "name": "The Champagne Method coaching",
            "serviceType": "Personal and professional coaching",
            "provider": { "@id": "https://thechampagnemethod.co/#person" },
            "areaServed": "US",
            "url": "https://thechampagnemethod.co/"
          }
        ]
      }
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
