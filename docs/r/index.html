<!doctype html>
<!--
  The Verbal Reflections day link: https://thechampagnemethod.co/r/?d=YYYY-MM-DD

  One short link, two correct destinations.

  ON THE PHONE this page is never rendered. /.well-known/assetlinks.json vouches for the app, so
  Android hands the URL straight to Verbal Reflections and opens the day there.

  ANYWHERE ELSE — a laptop, or a phone without the app — it lands here and shows the day.

  It EMBEDS the day view rather than redirecting to it, for two reasons that both showed up only
  when looked at. Google puts a "This application was created by a Google Apps Script user" bar
  across the top of every /exec page, which cannot be removed from inside the page but does not
  appear when the page is framed. And the address stays on this domain instead of becoming a
  hundred-character script.google.com URL. The script sets XFrameOptionsMode.ALLOWALL to permit it.

  Why the day view is an Apps Script web app rather than part of this site: this site is a static
  build with no server and no access to the journal, which is private. Signing in from the browser
  and calling the Drive API does not work either — a web OAuth client is a different app from the
  phone, so drive.file would not see files the phone created, and the scopes that would are
  SENSITIVE and require Google verification, which this project has stayed clear of throughout. The
  Apps Script already runs as the journal's owner and already reads the catalog. Its access is set
  to "only myself": it reads a private journal, so anyone who could open it could read it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verbal Reflections</title>
    <style>
      /* Navy950 from the app's Theme.kt, so there is no flash of a different product while the
         frame loads. */
      html, body { margin: 0; height: 100%; background: #0b1428; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      noscript p {
        color: #8da3cc;
        font-family: system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <iframe id="day" title="Verbal Reflections"></iframe>
    <noscript>
      <p>This page needs JavaScript to show the day.</p>
    </noscript>
    <script>
      var DAY_VIEW =
        "https://script.google.com/macros/s/AKfycbyxbfPqyKVIjVW4_tMe89GsSWjFDlIYsnUVHt66n8dda7qvnObwu_pcRNv0VWyhlix3Xg/exec";

      // Only a well-formed date is passed on. Anything else and the day view falls back to
      // yesterday on its own, which is the sensible answer for a link opened without one.
      var day = new URLSearchParams(location.search).get("d");
      document.getElementById("day").src = /^\d{4}-\d{2}-\d{2}$/.test(day || "")
        ? DAY_VIEW + "?d=" + encodeURIComponent(day)
        : DAY_VIEW;
    </script>
  </body>
</html>
