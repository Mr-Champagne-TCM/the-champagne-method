<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Privacy | The Champagne Method</title>
    <!--
      THIS URL IS KEPT ALIVE ON PURPOSE.

      The policy moved to /readings/privacy/, because everything on it is about
      buying a Human Design reading and none of it is about the coaching. At the
      root it read as a policy for the whole practice.

      This file is not the policy. It is the old address, still answering, so
      that a link already handed out does not become a 404 -- including the one
      on file with Stripe. It lives in public/ rather than being a build entry,
      so Vite copies it through untouched and it can never drift from the real
      page: there is nothing in it to drift.
    -->
    <link rel="canonical" href="https://thechampagnemethod.co/readings/privacy/" />
    <meta http-equiv="refresh" content="0; url=/readings/privacy/" />
    <script>window.location.replace('/readings/privacy/');</script>
  </head>
  <body>
    <p>The privacy policy has moved to <a href="/readings/privacy/">/readings/privacy/</a>.</p>
  </body>
</html>
